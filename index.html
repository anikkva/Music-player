<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/style.css">
</head>
<body>

<main class="player">
  <div class="deck">
    <div class="deck-logo">♪</div>

    <div class="platter" id="platter">
      <div class="vinyl" id="vinyl">
        <div class="label" id="label">
          <span class="label-glyph" id="labelGlyph">S</span>
        </div>
        <div class="spindle"></div>
      </div>
    </div>

    <div class="tonearm" id="tonearm">
      <div class="tonearm-pivot"></div>
      <div class="tonearm-stick"></div>
      <div class="tonearm-head"></div>
    </div>

    <div class="deck-switch"></div>
  </div>

  <div class="meta">
    <div class="meta-row">
      <div class="meta-text">
        <div class="title" id="title">—</div>
        <div class="artist" id="artist">—</div>
      </div>
      <button class="like" id="like" aria-label="Добавить в понравившиеся" aria-pressed="false">♡</button>
    </div>
  </div>

  <div class="seek">
    <span class="time" id="timeCurrent">0:00</span>
    <div class="seek-track" id="seekTrack">
      <div class="seek-fill" id="seekFill"></div>
      <div class="seek-dot" id="seekDot"></div>
    </div>
    <span class="time" id="timeDuration">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl ctrl-small" id="shuffle" aria-label="Перемешать" aria-pressed="false">🔀</button>
    <button class="ctrl" id="prev" aria-label="Предыдущий трек">⏮</button>
    <button class="ctrl ctrl-play" id="playPause" aria-label="Играть">▶</button>
    <button class="ctrl" id="next" aria-label="Следующий трек">⏭</button>
    <button class="ctrl ctrl-small" id="listToggle" aria-label="Список треков" aria-pressed="false">☰</button>
  </div>

  <div class="volume">
    <span class="volume-icon">🔊</span>
    <input type="range" id="volume" min="0" max="100" value="80" aria-label="Громкость">
  </div>

  <ul class="track-list" id="trackList" hidden></ul>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
